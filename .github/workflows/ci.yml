name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 前端：150 个 Vitest 用例（纯 JS，任何平台可跑）
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-quota-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: model-quota-frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # 桌面壳：Rust 编译检查（generate_context! 需要前端产物，先构建 dist）
  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: model-quota-frontend/package-lock.json
      - run: npm ci
        working-directory: model-quota-frontend
      - run: npm run build
        working-directory: model-quota-frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check
        working-directory: src-tauri
