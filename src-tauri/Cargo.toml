[package]
name = "model-quota-app"
version = "0.1.0"
description = "看额度 - 托盘常驻的大模型额度查询小工具"
authors = ["model-quota"]
edition = "2021"

[lib]
name = "model_quota_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
